<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>충남 농업재해 위성관측 지원</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<header>
  <div class="head-left">
    <h1>충남 농업재해 위성관측 지원</h1>
    <p class="sub">호우를 위성으로 확인할 수 있는 사건인지 먼저 판정하고, 확인된 사건만 필지 단위로 판독합니다.</p>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <aside class="panel left">
    <div class="live" id="live"></div>

    <div class="tabs" id="tabs">
      <button data-tab="storms" class="on">호우 사건</button>
      <button data-tab="emd">읍면동 순위</button>
    </div>

    <div id="storms-pane">
      <p class="hint" id="archive-hint"></p>
      <div class="filters" id="filters">
        <button data-filter="all" class="on">전체</button>
        <button data-filter="A">A</button>
        <button data-filter="B">B</button>
        <button data-filter="C">C</button>
        <button data-filter="missed">미관측</button>
      </div>
      <ul id="storm-list"></ul>
    </div>

    <div id="emd-pane" style="display:none">
      <p class="hint">젖은 관측 15건(2017~2024)에서 농경지가 침수 후보로 판정된 평균 비율입니다.
        클릭하면 해당 읍면동으로 이동합니다.</p>
      <ul id="emd-list" class="ranking"></ul>
    </div>
  </aside>

  <section class="map-wrap">
    <div id="map"></div>
    <div class="legend">
      <span class="swatch flood"></span> 침수 후보 (이중반사 z&gt;2)
      <span class="swatch border"></span> 시군 경계
      <span id="overlay-state"></span>
      <span class="zoom-hint" id="zoom-hint">확대하면 필지 단위로 볼 수 있습니다</span>
    </div>
  </section>

  <aside class="panel right">
    <h2 id="detail-title">사건을 선택하세요</h2>
    <div id="detail"></div>

    <div class="compare">
      <h3>같은 사건, 두 관측</h3>
      <p class="hint">2025년 7월 호우(peak 07-17)는 두 번 관측됐습니다. 5일 차이로 결과가 갈립니다.</p>
      <div class="compare-row">
        <button data-overlay="o134_2025-07-19">07-19 <small>+40h · A</small></button>
        <button data-overlay="o127_2025-07-24">07-24 <small>+172h · C</small></button>
      </div>
      <div id="compare-bars"></div>
    </div>
  </aside>
</main>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app.js?v=5"></script>
</body>
</html>
